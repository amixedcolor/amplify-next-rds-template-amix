name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # amplify_outputs.json is generated by `ampx sandbox` / pipeline-deploy and is
      # git-ignored; write a placeholder so the frontend can type-check and build.
      - name: Write placeholder amplify_outputs.json
        run: |
          cat > amplify_outputs.json <<'JSON'
          {
            "version": "1.4",
            "auth": {
              "aws_region": "us-east-1",
              "user_pool_id": "us-east-1_placeholder",
              "user_pool_client_id": "placeholder"
            },
            "custom": { "blocks_api_url": "https://example.com/aws-blocks/api" }
          }
          JSON
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
