version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - npm install -g pnpm@11.2.2
        - pnpm config set store-dir .pnpm-store
    build:
      commands:
        - pnpm install --frozen-lockfile
        # Stop before deploying if the DB types are stale or the backend has type errors
        # (Lambda bundling with esbuild does not type-check).
        - pnpm db:types --verify
        - pnpm typecheck:backend
        - NODE_OPTIONS=--conditions=cdk pnpm exec ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .pnpm-store/**/*
